# docker-compose.yml umieszczony w: infra/docker-compose.yml
# Uruchamiasz z katalogu infra/: docker compose up -d
# Albo z roota projektu:          docker compose -f infra/docker-compose.yml up -d

services:

  # ── Caddy: jedyny punkt wejścia z zewnątrz ──────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # infra/Caddyfile → kontener (read-only)
      - caddy-data:/data                        # certyfikaty TLS Let's Encrypt
      - caddy-config:/config                    # wewnętrzny cache Caddy
    networks:
      - internal

  # ── API: Hono + TypeScript ───────────────────────────────────────────────────
  api:
    build:
      context: ../api          # katalog api/ względem infra/docker-compose.yml
      dockerfile: Dockerfile   # api/Dockerfile
    restart: unless-stopped
    # Brak `ports` — api NIE jest dostępne z zewnątrz, tylko przez Caddy
    env_file:
      - ../.env                      # .env w korzeniu projektu
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/db.sqlite
      - MINIO_ENDPOINT=minio         # nazwa usługi = hostname w sieci Dockera
      - MINIO_PORT=9000
    volumes:
      - sqlite-data:/app/data        # plik db.sqlite poza kontenerem
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy   # api startuje dopiero gdy MinIO jest gotowe

  # ── MinIO: S3-kompatybilny storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Brak `ports` — niedostępne z zewnątrz
    env_file:
      - ../.env                      # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── minio-init: jednorazowe tworzenie bucketów ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    restart: no                      # uruchamia się raz i kończy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/photos;
        mc mb --ignore-existing local/videos;
        mc mb --ignore-existing local/review-media;
        mc mb --ignore-existing local/brand-assets;
        exit 0;
      "
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy

# ── Wolumeny ────────────────────────────────────────────────────────────────────
volumes:
  sqlite-data:    # plik db.sqlite — dane aplikacji i auth (better-auth)
  minio-data:     # pliki binarne: zdjęcia, wideo, obrazy telefonów
  caddy-data:     # certyfikaty TLS — utrata = konieczność ponownego pobrania
  caddy-config:   # wewnętrzny cache Caddy

# ── Sieci ───────────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    # Sieć izolowana — kontenery widzą się nawzajem, ale nie są widoczne z zewnątrz
