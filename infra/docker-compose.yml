# infra/docker-compose.yml

services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

  # Jednorazowy krok migracji — odpalany z etapu "builder" Dockerfile'a
  # (tam, gdzie jest drizzle-kit; obraz produkcyjny go nie ma, bo to
  # devDependency). Bez tego serwisu świeży wolumen sqlite-data nie ma
  # ani jednej tabeli i "api" pada od razu przy starcie.
  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    env_file:
      - ../.env
    environment:
      - DATABASE_PATH=/app/data/db.sqlite
    volumes:
      - sqlite-data:/app/data
    command: ["npx", "drizzle-kit", "migrate"]
    networks:
      - internal

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Tylko wartości zależne od topologii sieci Dockera. API_BASE_URL
      # i ALLOWED_ORIGINS celowo NIE są tu zahardkodowane — `environment:`
      # nadpisuje `env_file`, więc gdyby były tu wpisane na sztywno,
      # zmiana ich w .env nic by nie dała. Oba pochodzą teraz z ../.env
      # (patrz _env / .env.example).
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/db.sqlite
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
    volumes:
      - sqlite-data:/app/data
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ../.env
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/photos;
        mc mb --ignore-existing local/videos;
        mc mb --ignore-existing local/review-media;
        mc mb --ignore-existing local/device-images;
        mc anonymous set download local/photos;
        mc anonymous set download local/videos;
        mc anonymous set download local/review-media;
        mc anonymous set download local/device-images;
        exit 0;
      "
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy

volumes:
  sqlite-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
